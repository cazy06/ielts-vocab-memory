*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;overflow-x:hidden}
.card-scene{perspective:1200px}

.slide-up{animation:slideUp .35s ease}
.progress-bar{height:3px;background:#1e293b;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#e91e8c,#f43f5e);border-radius:2px;transition:width .5s ease}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
.btn{transition:all .15s ease}
.btn:active{transform:scale(.95)}
input,textarea{font-family:inherit}

// ===== ストレージ =====
const SK='ielts_memory_v1';
const OLD_SK='ielts_v2';
function todayStr(){return new Date().toLocaleDateString('ja-JP');}
function emptyStore(){return{progress:{},custom:[],dailyDate:'',dailyCount:0,marked:{},migratedFromOld:false}}
function normalizeStore(p){return{...emptyStore(),...(p||{}),progress:(p&&p.progress)||{},custom:(p&&p.custom)||[],marked:(p&&p.marked)||{}}}
function load(){
  try{
    const d=localStorage.getItem(SK);
    if(d)return normalizeStore(JSON.parse(d));
    const old=localStorage.getItem(OLD_SK);
    if(old){
      const migrated={...normalizeStore(JSON.parse(old)),migratedFromOld:true,migratedAt:new Date().toISOString()};
      localStorage.setItem(SK,JSON.stringify(migrated));
      return migrated;
    }
    return emptyStore();
  }catch{return emptyStore()}
}
function save(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch{}}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

const PREFIXES=[
  ['anti-','反対の'],['auto-','自分で'],['bene-','よい'],['co-/com-/con-','一緒に'],['de-','下へ・離れて'],
  ['dis-','否定・反対'],['ex-/e-','外へ'],['in-/im-/il-/ir-','中へ・否定'],['inter-','間に'],
  ['mis-','誤って'],['pre-','前もって'],['pro-','前へ・賛成'],['re-','再び・後ろへ'],['sub-','下に'],
  ['trans-','越えて'],['un-','否定']
];
const SUFFIXES=[
  ['-able/-ible','できる'],['-al','形容詞化'],['-ance/-ence','名詞化'],['-ant/-ent','人・性質'],['-ary','関係する'],
  ['-er/-or','人・もの'],['-ful','満ちた'],['-ify','〜にする'],['-ion/-tion/-sion','名詞化'],['-ive','性質がある'],
  ['-ity','状態・性質'],['-less','ない'],['-ly','副詞化'],['-ment','行為・結果'],['-ous','性質がある']
];
const ROOT_HINTS=[
  ['act','動く・行う'],['aud','聞く'],['cap/capt/cept','つかむ・取る'],['ced/ceed/cess','行く・進む'],['claim/clam','叫ぶ・求める'],
  ['cred','信じる'],['cur/curs','走る'],['dict','言う'],['duc/duct','導く'],['fac/fect/fic','作る・行う'],
  ['fer','運ぶ'],['form','形作る'],['gen','生む'],['grad/gress','歩む・段階'],['graph','書く'],
  ['ject','投げる'],['leg/lect','読む・選ぶ'],['log','言葉・論理'],['mit/miss','送る'],['mot/mov','動く'],
  ['pel/puls','押す'],['pend','ぶら下がる・頼る'],['plic/ply','折る・重ねる'],['port','運ぶ・港'],['pos/pon','置く'],
  ['press','押す'],['reg','支配する・まっすぐにする'],['sci','知る'],['scrib/script','書く'],['sect','切る'],
  ['spec/spect','見る'],['spir','息をする'],['stat/stit','立つ'],['struct','組み立てる'],['tain/ten/tent','保つ'],
  ['tract','引く'],['ven/vent','来る'],['vid/vis','見る'],['voc/vok','声・呼ぶ'],['volv','回る']
];
function guessAffixes(word){
  const w=(word||'').toLowerCase();
  const hits=[];
  PREFIXES.forEach(([a,m])=>{
    const forms=a.replaceAll('/',' ').replaceAll('-','').split(' ');
    if(forms.some(f=>f&&w.startsWith(f)))hits.push(`${a} = ${m}`);
  });
  SUFFIXES.forEach(([a,m])=>{
    const forms=a.replaceAll('/',' ').replaceAll('-','').split(' ');
    if(forms.some(f=>f&&w.endsWith(f)))hits.push(`${a} = ${m}`);
  });
  return hits.slice(0,3);
}
function guessRootInfo(word){
  const w=(word||'').toLowerCase();
  const hit=ROOT_HINTS.find(([forms])=>forms.split('/').some(f=>f&&w.includes(f)));
  if(!hit)return null;
  const [forms,meaning]=hit;
  const label=forms.split('/')[0];
  return {
    part:`${label} = ${meaning}`,
    note:`語根 ${label} には「${meaning}」という意味の方向があります。この中心イメージから現在の意味へ広がったと考えると、丸暗記より思い出しやすくなります。`
  };
}
function memoryInfo(word){
  const key=(word?.w||'').toLowerCase();
  if(MEMORY_MAP[key])return MEMORY_MAP[key];
  const affixes=guessAffixes(key);
  const root=guessRootInfo(key);
  const parts=[...affixes];
  if(root)parts.unshift(root.part);
  return {
    pos:word?.m?.includes('；')?'複数の品詞・意味あり':'確認中',
    parts:parts.slice(0,4),
    core:word?.m||'',
    note:root?root.note:affixes.length?'接頭辞・接尾辞から意味の方向を推測できます。詳細語源は今後追加します。':'この単語は丸暗記より、例文の場面と一緒に覚えるのが向いています。',
    family:''
  };
}

function MemoryBox({word,compact=false}){
  const info=memoryInfo(word);
  return(

// ===== 発音 (ResponsiveVoice) =====
function speak(word,e){
  if(e){e.stopPropagation();}
  if(window.responsiveVoice){
    responsiveVoice.speak(word,'US English Female',{rate:0.9});
  } else {
    // フォールバック: Web Speech API
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);
    u.lang='en-US';u.rate=0.85;
    window.speechSynthesis.speak(u);
  }
}

// ===== 日本語発音 =====
function speakJa(text){
  if(!text)return;
  if(window.responsiveVoice){
    responsiveVoice.speak(text,'Japanese Female',{rate:0.85});
  } else {
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=0.85;
    window.speechSynthesis.speak(u);
  }
}

const DAILY_GOAL=100;
function App(){
  const[tab,setTab]=useState('flash');
  const[store,setStore]=useState(load);
  const[scrolled,setScrolled]=useState(false);
  useEffect(()=>{
    const fn=()=>setScrolled(window.scrollY>44);
    window.addEventListener('scroll',fn,{passive:true});
    return()=>window.removeEventListener('scroll',fn);
  },[]);
  const words=useMemo(()=>[...BASE_WORDS,...(store.custom||[])],[store.custom]);

  // 日別カウンター付きsetProgress
  const setProgress=useCallback(p=>{
    const today=todayStr();
    let dc=store.dailyDate===today?(store.dailyCount||0):0;
    // 増減を検出（新たに覚えた / 未習に戻した）
    const allIds=new Set([...Object.keys(p),...Object.keys(store.progress||{})]);
    for(const id of allIds){
      const was=!!(store.progress||{})[id];
      const now=!!p[id];
      if(!was&&now)dc++;
      if(was&&!now)dc=Math.max(0,dc-1);
    }
    const ns={...store,progress:p,dailyDate:today,dailyCount:dc};
    setStore(ns);save(ns);
  },[store]);

  const addWord=useCallback(w=>{const nc=[...(store.custom||[]),w];const ns={...store,custom:nc};setStore(ns);save(ns)},[store]);
  const setMarked=useCallback(m=>{const ns={...store,marked:m};setStore(ns);save(ns)},[store]);
  const replaceStore=useCallback(next=>{const ns=normalizeStore(next);setStore(ns);save(ns)},[]);
  const knownCount=Object.values(store.progress||{}).filter(Boolean).length;
  const dailyCount=store.dailyDate===todayStr()?(store.dailyCount||0):0;
  return(
    <div style={{maxWidth:480,margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <Nav tab={tab} setTab={setTab} known={knownCount} total={words.length} dailyCount={dailyCount} scrolled={scrolled}/>
      <div style={{flex:1,paddingBottom:'env(safe-area-inset-bottom,16px)'}}>
        {tab==='flash'&&<Flash words={words} progress={store.progress} setProgress={setProgress} marked={store.marked||{}} setMarked={setMarked}/>}
        {tab==='quiz'&&<Quiz words={words} progress={store.progress} setProgress={setProgress}/>}
        {tab==='list'&&<List words={words} progress={store.progress} setProgress={setProgress} marked={store.marked||{}} setMarked={setMarked}/>}
        {tab==='add'&&<Add addWord={addWord} total={words.length}/>}
        {tab==='data'&&<DataTools store={store} replaceStore={replaceStore} words={words}/>}
      </div>
    </div>
  );
}

  const[deck,setDeck]=useState(()=>shuffle(words));
  const[idx,setIdx]=useState(0);
  const[flipped,setFlipped]=useState(false);
  const[key,setKey]=useState(0);
  const[autoPlay,setAutoPlay]=useState(false);
  const[autoPhase,setAutoPhase]=useState(''); // 'en1','en2','ja1','ja2',''
  const timersRef=useRef([]);

  const pool=useMemo(()=>filter==='unknown'?deck.filter(w=>!progress[w.id]):filter==='marked'?deck.filter(w=>marked[w.id]):deck,[deck,filter,progress,marked]);
  const cur=pool[idx%Math.max(pool.length,1)];
  const isKnown=cur?!!progress[cur.id]:false;
  const isMarked=cur?!!marked[cur.id]:false;
  const cardHeight=flipped?390:210;
  function toggleMark(){if(!cur)return;const m={...marked,[cur.id]:!marked[cur.id]};setMarked(m);}

  function clearAuto(){
    timersRef.current.forEach(clearTimeout);
    timersRef.current=[];
    if(window.responsiveVoice)responsiveVoice.cancel();
    else if(window.speechSynthesis)window.speechSynthesis.cancel();
    setAutoPhase('');
  }

  function go(known){
    if(!cur)return;
    if(known!==undefined){const p={...progress,[cur.id]:known};setProgress(p)}
    clearAuto();
    setFlipped(false);
    setTimeout(()=>{setIdx(i=>(i+1)%Math.max(pool.length,1));setKey(k=>k+1)},150);
  }

  // 自動再生シーケンス

    clearAuto();

    const add=(fn,d)=>{const id=setTimeout(fn,d);timersRef.current.push(id);};
    // 英語×2

    add(()=>{setAutoPhase('en2');speak(cur.w);},2700);

    add(()=>{setAutoPhase('ja1');speakJa(cur.m||cur.w);},5200);

      setTimeout(()=>{setIdx(i=>(i+1)%Math.max(pool.length,1));setKey(k=>k+1);},200);
    },12000);

// ===== QUIZ =====
function Quiz({words,progress,setProgress}){
  const[state,setState]=useState('idle');
  const[qs,setQs]=useState([]);
  const[qi,setQi]=useState(0);
  const[sel,setSel]=useState(null);
  const[score,setScore]=useState(0);
  const[shake,setShake]=useState(false);
  const[dir,setDir]=useState('en2ja');

  function start(){
    const pool=shuffle(words).slice(0,Math.min(10,words.length));
    const questions=pool.map(w=>{
      const wrongs=shuffle(words.filter(x=>x.id!==w.id)).slice(0,3);
      return{word:w,options:shuffle([w,...wrongs])};
    });
    setQs(questions);setQi(0);setSel(null);setScore(0);setState('playing');
  }

  function pick(opt){
    if(sel)return;
    setSel(opt);
    const ok=opt.id===qs[qi].word.id;
    if(ok){setScore(s=>s+1);const p={...progress,[qs[qi].word.id]:true};setProgress(p)}
    else{setShake(true);setTimeout(()=>setShake(false),500)}
    setTimeout(()=>{
      if(qi+1>=qs.length)setState('result');
      else{setQi(i=>i+1);setSel(null)}
    },900);
  }

  if(state==='idle')return(
    <div style={{padding:'32px 20px',textAlign:'center'}}>
      <div style={{fontSize:52,marginBottom:16}}>📝</div>
      <div style={{fontSize:20,fontWeight:800,marginBottom:6}}>クイズモード</div>
      <div style={{color:'#64748b',fontSize:13,marginBottom:28}}>ランダム10問・4択で答えましょう</div>
      <div style={{display:'flex',gap:8,marginBottom:28}}>
        {[['en2ja','英 → 日'],['ja2en','日 → 英']].map(([v,l])=>(
          <button key={v} onClick={()=>setDir(v)} className="btn"
            style={{flex:1,padding:'10px',fontSize:13,fontWeight:700,
              background:dir===v?'#e91e8c':'#1e293b',color:dir===v?'#fff':'#64748b',
              border:'none',borderRadius:10,cursor:'pointer'}}>{l}</button>
        ))}
      </div>
      <button onClick={start} className="btn"
        style={{background:'linear-gradient(135deg,#e91e8c,#f43f5e)',color:'#fff',border:'none',
          borderRadius:14,padding:'16px 48px',fontWeight:800,fontSize:16,cursor:'pointer'}}>
        スタート
      </button>
    </div>
  );

  if(state==='result'){
    const pct=Math.round(score/qs.length*100);
    return(
      <div style={{padding:'40px 20px',textAlign:'center'}}>
        <div style={{fontSize:52,marginBottom:16}}>{pct>=80?'🎉':pct>=50?'💪':'📚'}</div>
        <div style={{fontSize:22,fontWeight:800,marginBottom:6}}>結果</div>
        <div style={{fontSize:52,fontWeight:900,color:'#e91e8c'}}>{score}<span style={{fontSize:22,color:'#475569'}}>/{qs.length}</span></div>
        <div style={{fontSize:13,color:'#475569',marginBottom:32}}>正答率 {pct}%</div>
        <button onClick={()=>setState('idle')} className="btn"
          style={{background:'linear-gradient(135deg,#e91e8c,#f43f5e)',color:'#fff',border:'none',
            borderRadius:14,padding:'14px 40px',fontWeight:700,fontSize:15,cursor:'pointer'}}>
          もう一度
        </button>
      </div>
    );
  }

  const q=qs[qi];
  return(
    <div style={{padding:'14px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}>
        <div style={{flex:1}}><div className="progress-bar"><div className="progress-fill" style={{width:`${qi/qs.length*100}%`}}/></div></div>
        <div style={{fontSize:11,color:'#475569'}}>{qi+1}/{qs.length}</div>
      </div>
      <div style={{
        background:'linear-gradient(145deg,#1e293b,#0f172a)',borderRadius:16,padding:'28px 20px',
        textAlign:'center',marginBottom:20,border:'1px solid #334155',
        animation:shake?'shake .4s ease':'none'}}>
        {dir==='en2ja'?(
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
            <div style={{fontSize:34,fontWeight:800,color:'#f8fafc'}}>{q.word.w}</div>
            <button onClick={e=>{e.stopPropagation();speak(q.word.w)}} className="btn"
              style={{fontSize:20,background:'none',border:'none',cursor:'pointer',padding:'4px',color:'#94a3b8'}}>🔊</button>
          </div>
        ):(
          <div style={{fontSize:22,fontWeight:700,color:'#f8fafc',lineHeight:1.4}}>{q.word.m}</div>
        )}
        <div style={{fontSize:11,color:'#334155',marginTop:6}}>#{String(q.word.id).padStart(4,'0')}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {q.options.map(opt=>{
          const correct=opt.id===q.word.id;
          const picked=sel?.id===opt.id;
          let bg='#1e293b',border='#334155',col='#f1f5f9';
          if(sel){
            if(correct){bg='#14532d33';border='#34d399';col='#34d399'}
            else if(picked){bg='#450a0a33';border='#f87171';col='#f87171'}
          }
          return(
            <button key={opt.id} onClick={()=>pick(opt)} className="btn"
              style={{padding:'13px 10px',fontSize:13,fontWeight:600,
                background:bg,color:col,border:`2px solid ${border}`,
                borderRadius:12,cursor:sel?'default':'pointer',
                transition:'all .2s',lineHeight:1.3,minHeight:60}}>
              {dir==='en2ja'?opt.m||'(意味未設定)':opt.w}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function buildLearningStateRows(words,progress,marked){
  const source='IELTS VOCAB MEMORY '+new Date().toLocaleString('ja-JP');
  return [
    ['ID','単語 Word','習得チェック','マーク','更新元'],
    ...words.map(w=>[
      w.id,
      w.w,
      progress[w.id]?'✓ 習得済':'学習中',
      marked[w.id]?'✓':'',
      source
    ])
  ];
}
function tsvCell(v){return String(v??'').replace(/\t/g,' ').replace(/\r?\n/g,' ')}
function learningCsvCell(v){
  const s=String(v??'');
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function downloadTextFile(filename,text,type){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
async function copyText(text){
  if(navigator.clipboard&&window.isSecureContext){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(e){}
  }
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed';
  ta.style.left='-9999px';
  ta.style.top='0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok=false;
  try{ok=document.execCommand('copy')}catch(e){ok=false}
  ta.remove();
  return ok;
}
function List({words,progress,setProgress,marked,setMarked}){
  const[search,setSearch]=useState('');
  const[filter,setFilter]=useState('all');
  const[exportStatus,setExportStatus]=useState('');
  const filtered=words.filter(w=>{
    const s=search.toLowerCase();
    const match=w.w.toLowerCase().includes(s)||w.m.includes(s);
    const flt=filter==='all'||(filter==='known'?progress[w.id]:filter==='unknown'?!progress[w.id]:marked[w.id]);
    return match&&flt;
  });
  function toggle(id){const p={...progress,[id]:!progress[id]};setProgress(p)}
  function toggleMark(id){const m={...marked,[id]:!marked[id]};setMarked(m)}
  async function copyLearningState(){
    const rows=buildLearningStateRows(words,progress,marked);
    const text=rows.map(r=>r.map(tsvCell).join('\t')).join('\n');
    if(await copyText(text)){
      setExportStatus('コピーしました。シート「アプリ学習状態」のA1から貼り付けできます。');
    }else{
      downloadTextFile('ielts_vocab_learning_state.tsv','\ufeff'+text,'text/tab-separated-values;charset=utf-8');
      setExportStatus('コピー権限が使えないため、TSVを保存しました。シート「アプリ学習状態」に取り込めます。');
    }
    setTimeout(()=>setExportStatus(''),5000);

  function downloadLearningState(){
    const rows=buildLearningStateRows(words,progress,marked);
    const text='\ufeff'+rows.map(r=>r.map(learningCsvCell).join(',')).join('\n');

    setExportStatus('CSVを保存しました。シート「アプリ学習状態」に取り込めます。');
    setTimeout(()=>setExportStatus(''),5000);

    <div>
      <div style={{padding:'12px 16px 0'}}>

      <div style={{display:'flex',gap:6,padding:'10px 16px',flexWrap:'wrap'}}>
        {[['all',`全て(${words.length})`],['known',`習得(${counts.known})`],['unknown',`未習得(${counts.unknown})`],['marked',`マーク(${counts.marked})`]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} className="btn"
            style={{padding:'5px 12px',fontSize:10,fontWeight:700,
              background:filter===v?(v==='marked'?'#7c3a1e':'#e91e8c'):'#1e293b',
              color:filter===v?'#fff':'#64748b',border:'none',borderRadius:20,cursor:'pointer'}}>
            {l}
          </button>
        ))}
      </div>
      <div style={{padding:'0 16px 10px'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <button onClick={copyLearningState} className="btn"
            style={{padding:'10px 8px',fontSize:12,fontWeight:800,
              background:'#0f766e',color:'#ecfeff',border:'1px solid #14b8a655',
              borderRadius:10,cursor:'pointer'}}>
            Sheets用コピー
          </button>
          <button onClick={downloadLearningState} className="btn"
            style={{padding:'10px 8px',fontSize:12,fontWeight:800,
              background:'#1e293b',color:'#cbd5e1',border:'1px solid #334155',
              borderRadius:10,cursor:'pointer'}}>
            CSV保存
          </button>
        </div>
        <a href="https://docs.google.com/spreadsheets/d/1rD8yNFe8uvejOSAH9Cqy6yvo1Mg18IWLMUpDF36M1gI/edit?gid=1800001002#gid=1800001002"
          target="_blank" rel="noopener noreferrer"
          style={{display:'block',marginTop:8,fontSize:11,color:'#38bdf8',textDecoration:'none'}}>
          スプレッドシートを開く
        </a>
        {exportStatus&&(
          <div style={{marginTop:8,padding:'9px 10px',background:'#042f2e',
            border:'1px solid #0f766e',borderRadius:8,color:'#99f6e4',

            {exportStatus}
          </div>
        )}
      </div>
      <div style={{paddingBottom:80}}>
        {filtered.map(w=>{
          const mk=!!marked[w.id];
          return(
          <div key={w.id} style={{
            padding:'12px 16px',borderBottom:'1px solid #1e293b',
            display:'flex',alignItems:'flex-start',gap:12,

        );})}
        {filtered.length===0&&(
          <div style={{padding:40,textAlign:'center',color:'#334155'}}>該当する単語がありません</div>
        )}
      </div>
    </div>
  );

// ===== DATA TOOLS =====
function DataTools({store,replaceStore,words}){
  const[text,setText]=useState('');
  const[msg,setMsg]=useState('');
  const known=Object.values(store.progress||{}).filter(Boolean).length;
  const marked=Object.values(store.marked||{}).filter(Boolean).length;
  const payload=JSON.stringify({...normalizeStore(store),exportedAt:new Date().toISOString()},null,2);

  function copyExport(){
    navigator.clipboard?.writeText(payload);
    setText(payload);
    setMsg('学習データを表示しました。コピーして別端末へ移せます。');
  }
  function downloadExport(){
    const blob=new Blob([payload],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`ielts-vocab-memory-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setMsg('JSONファイルを書き出しました。');
  }
  function csvCell(v){
    v=String(v??'');
    return /[",\n\r]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
  }
  function downloadStatusCsv(){
    const rows=[['ID','単語 Word','習得チェック','マーク','更新元']];
    words.forEach(w=>{
      rows.push([
        w.id,
        w.w,
        store.progress?.[w.id]?'✓ 習得済':'学習中',
        store.marked?.[w.id]?'マーク':'',
        'IELTS VOCAB MEMORY'
      ]);
    });
    const csv=rows.map(r=>r.map(csvCell).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`ielts-vocab-status-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    setMsg('Google Sheets用の学習状態CSVを書き出しました。');
  }
  function importText(){
    try{
      const data=JSON.parse(text);
      if(!data.progress&&!data.custom&&!data.marked)throw new Error('invalid');
      replaceStore(normalizeStore(data));
      setMsg('学習データを取り込みました。');
    }catch{
      setMsg('取り込みできませんでした。JSONの内容を確認してください。');
    }
  }
  function readFile(e){
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>setText(String(reader.result||''));
    reader.readAsText(file);
  }
  function importOldNow(){
    try{
      const old=localStorage.getItem(OLD_SK);
      if(!old){setMsg('この端末では旧アプリのデータが見つかりませんでした。');return;}
      replaceStore({...normalizeStore(JSON.parse(old)),migratedFromOld:true,migratedAt:new Date().toISOString()});
      setMsg('旧アプリのデータを取り込みました。');
    }catch{setMsg('旧アプリのデータを読み込めませんでした。')}
  }

  return(
    <div style={{padding:'18px 16px 80px'}}>
      <div style={{background:'#1e293b',border:'1px solid #334155',borderRadius:14,padding:16,marginBottom:14}}>
        <div style={{fontSize:18,fontWeight:800,marginBottom:10}}>学習データ</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
          <div style={{background:'#0f172a',borderRadius:10,padding:12}}>
            <div style={{fontSize:10,color:'#64748b'}}>習得済み</div>
            <div style={{fontSize:24,fontWeight:900,color:'#34d399'}}>{known}<span style={{fontSize:12,color:'#64748b'}}>/{words.length}</span></div>
          </div>
          <div style={{background:'#0f172a',borderRadius:10,padding:12}}>
            <div style={{fontSize:10,color:'#64748b'}}>マーク</div>
            <div style={{fontSize:24,fontWeight:900,color:'#fbbf24'}}>{marked}</div>
          </div>
        </div>
        {store.migratedFromOld&&<div style={{fontSize:12,color:'#c4b5fd',lineHeight:1.5,marginBottom:10}}>旧アプリ `ielts_v2` から取り込み済みです。</div>}
        <button onClick={importOldNow} className="btn" style={{width:'100%',padding:'12px',fontWeight:800,background:'#312e81',color:'#fff',border:'none',borderRadius:10,cursor:'pointer',marginBottom:8}}>
          旧アプリの保存データを取り込む
        </button>
        <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6}}>
          同じ `cazy06.github.io` 上で公開した場合、旧アプリのスマホ内データをこの画面から読み取れます。別ドメインで公開する場合は、JSONで移行します。
        </div>
      </div>

      <div style={{background:'#1e293b',border:'1px solid #334155',borderRadius:14,padding:16}}>
        <div style={{fontSize:16,fontWeight:800,marginBottom:10}}>エクスポート / インポート</div>
        <div style={{display:'flex',gap:8,marginBottom:10}}>
          <button onClick={copyExport} className="btn" style={{flex:1,padding:'11px',fontWeight:800,background:'#e91e8c',color:'#fff',border:'none',borderRadius:10,cursor:'pointer'}}>表示</button>
          <button onClick={downloadExport} className="btn" style={{flex:1,padding:'11px',fontWeight:800,background:'#0f172a',color:'#f8fafc',border:'1px solid #334155',borderRadius:10,cursor:'pointer'}}>保存</button>
        </div>
        <button onClick={downloadStatusCsv} className="btn" style={{width:'100%',padding:'11px',fontWeight:800,background:'#0369a1',color:'#fff',border:'none',borderRadius:10,cursor:'pointer',marginBottom:10}}>
          Google Sheets用CSVを書き出す
        </button>
        <input type="file" accept="application/json,.json" onChange={readFile} style={{width:'100%',fontSize:12,color:'#cbd5e1',marginBottom:8}}/>
        <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="ここにJSONを貼り付けて取り込み"
          style={{width:'100%',minHeight:160,padding:10,fontSize:12,lineHeight:1.5,background:'#0f172a',color:'#e2e8f0',border:'1px solid #334155',borderRadius:10,outline:'none',fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace'}}/>
        <button onClick={importText} className="btn" style={{width:'100%',marginTop:8,padding:'12px',fontWeight:800,background:'#14532d',color:'#fff',border:'none',borderRadius:10,cursor:'pointer'}}>
          JSONを取り込む
        </button>
        {msg&&<div style={{fontSize:12,color:'#fbbf24',lineHeight:1.5,marginTop:10}}>{msg}</div>}
      </div>
    </div>
  );
}

// ===== ADD =====
function Add({addWord,total}){
  const[w,setW]=useState('');
  const[m,setM]=useState('');
  const[s,setS]=useState('');
  const[ok,setOk]=useState(false);

  function submit(){
    if(!w.trim()||!m.trim())return;
    addWord({id:Date.now(),w:w.trim(),m:m.trim(),s:s.trim()});
    setW('');setM('');setS('');setOk(true);setTimeout(()=>setOk(false),2000);
  }

  const inp={width:'100%',padding:'11px 14px',fontSize:13,
    background:'#1e293b',color:'#f1f5f9',border:'1px solid #334155',
    borderRadius:10,outline:'none',marginBottom:10};
  return(
    <div style={{padding:'16px'}}>
      <div style={{fontSize:14,fontWeight:700,color:'#e91e8c',marginBottom:16}}>📥 単語を追加</div>
      <div style={{fontSize:11,color:'#475569',marginBottom:4}}>英単語 *</div>
      <input value={w} onChange={e=>setW(e.target.value)} placeholder="例: sustainable" style={inp}/>
      <div style={{fontSize:11,color:'#475569',marginBottom:4}}>日本語の意味 *</div>
      <input value={m} onChange={e=>setM(e.target.value)} placeholder="例: 持続可能な" style={inp}/>
      <div style={{fontSize:11,color:'#475569',marginBottom:4}}>類義語（任意）</div>
      <input value={s} onChange={e=>setS(e.target.value)} placeholder="例: eco-friendly" style={inp}/>
      <button onClick={submit} disabled={!w.trim()||!m.trim()} className="btn"
        style={{width:'100%',padding:'14px',fontSize:14,fontWeight:700,marginTop:4,
          background:(w.trim()&&m.trim())?'linear-gradient(135deg,#e91e8c,#f43f5e)':'#1e293b',
          color:(w.trim()&&m.trim())?'#fff':'#475569',
          border:'none',borderRadius:14,cursor:'pointer',transition:'all .2s'}}>
        ＋ 追加する
      </button>
      {ok&&<div style={{marginTop:12,padding:'11px',background:'#14532d33',border:'1px solid #34d399',
        borderRadius:10,color:'#34d399',fontSize:12,fontWeight:600,textAlign:'center',
        animation:'slideUp .3s ease'}}>✅ 追加しました！</div>}
      <div style={{marginTop:24,padding:16,background:'#1e293b',borderRadius:12,fontSize:12,
        color:'#64748b',lineHeight:1.8,border:'1px solid #334155'}}>
        <div style={{fontWeight:700,color:'#94a3b8',marginBottom:6}}>📊 現在の収録状況</div>
        <div>収録語数：<strong style={{color:'#e91e8c'}}>{total}語</strong>（動画OCR収録）</div>
        <div style={{marginTop:4}}>Kindleで単語を見ながらここに追加すると<br/>フラッシュカードとクイズに反映されます</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
